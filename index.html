
<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sөylem - Қазақ тілі мүшелеріне талдау</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .font-montserrat {
            font-family: 'Montserrat', sans-serif;
        }
        /* Custom underline styles for sentence members */
        .role-subject { border-bottom: 2px solid #3b82f6; } /* Бастауыш - 1 line */
        .role-predicate { border-bottom: 4px double #ef4444; } /* Баяндауыш - 2 lines */
        .role-attribute { text-decoration: underline wavy #10b981; } /* Анықтауыш - wavy */
        .role-object { border-bottom: 2px dashed #f59e0b; } /* Толықтауыш - dashed */
        .role-adverbial { border-bottom: 2px dash-dot #8b5cf6; } /* Пысықтауыш - dash-dot (simulated) */
        
        .role-adverbial-sim {
          background-image: linear-gradient(to right, #8b5cf6 50%, transparent 50%);
          background-position: bottom;
          background-size: 8px 2px;
          background-repeat: repeat-x;
        }
    </style>
